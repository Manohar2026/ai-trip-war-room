spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-trip-war-room

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripwarroom}
    username: ${DB_USERNAME:tripwarroom}
    password: ${DB_PASSWORD:local_dev_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.manohar.aitripwarroom: INFO
