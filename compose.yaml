services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-trip-war-room-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripwarroom}
      POSTGRES_USER: ${DB_USERNAME:-tripwarroom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - trip-war-room-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tripwarroom} -d ${POSTGRES_DB:-tripwarroom}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trip-war-room-postgres-data:
